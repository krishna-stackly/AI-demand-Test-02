# =============================================================================
# Single nginx entrypoint for the combined app:
#   - Everything (user site at "/" and admin panel at "/admin") is one SPA
#     served from the same static build — routing between them happens
#     client-side in React Router, not at the nginx level.
#   - /api/*  -> backend:8000/api/*
#   - /ws     -> backend:8000/ws        (WebSocket upgrade)
#   - /media/ -> backend:8000/media/    (uploaded files, served by FastAPI)
#
# Same-origin proxying means the browser never needs CORS for normal use —
# ALLOWED_ORIGINS on the backend is only a fallback for local `vite dev`.
# =============================================================================

upstream backend_api {
    server backend:8000;
}

# CSV uploads / training data can be sizeable — raise the default 1m limit.
client_max_body_size 50m;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend_api/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Forward cookies as-is so httpOnly refresh-token cookies keep working
        proxy_pass_request_headers on;
    }

    location /ws {
        proxy_pass http://backend_api/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /media/ {
        proxy_pass http://backend_api/media/;
        proxy_set_header Host $host;
    }

    # Long cache for hashed static assets Vite emits
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback: both "/" (user site) and "/admin/*" (admin panel) are
    # handled client-side by React Router inside the one bundle.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
